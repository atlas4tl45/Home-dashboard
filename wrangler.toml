# Cloudflare Pages configuration.
#
# `pages_build_output_dir` tells Cloudflare the built site lives in dist/ (still
# set the build command `npm run build` in the Pages dashboard).
name = "home-dashboard"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

# KV binding for the config API (functions/api/config.js). Create a KV
# namespace, then either:
#   - bind it in the Pages dashboard (Settings -> Functions -> KV namespace
#     bindings) as `DASHBOARD_KV`, and/or
#   - uncomment below and paste the namespace id (needed for `wrangler pages dev`).
#
# [[kv_namespaces]]
# binding = "DASHBOARD_KV"
# id = "<your-kv-namespace-id>"
