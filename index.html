<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070e11" />
    <title>Home Dashboard</title>
    <script>
      // Apply saved theme + accent before paint to avoid a flash of the wrong mode/color.
      try {
        var el = document.documentElement;
        var t = localStorage.getItem("hd.theme");
        var dark =
          t === "dark" ||
          (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) el.classList.add("dark");
        var av = localStorage.getItem("hd.accentVars");
        if (av) {
          var a = JSON.parse(av);
          el.style.setProperty("--accent", dark ? a.dark : a.light);
          el.style.setProperty("--accent-fg", "255 255 255");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
