name: Build dashboard

# Every push rebuilds the static bundle and refreshes the "dashboard-latest"
# release with a ready-to-deploy dashboard.zip — unzip it into Home
# Assistant's config/www/dashboard/. Run it manually from the Actions tab
# with "Run workflow" if needed.

on:
  push:
    branches: ["main", "claude/home-dashboard-redesign-izajrk"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: cd dist && zip -r ../dashboard.zip .
      - name: Publish dashboard-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dashboard-latest
          name: Dashboard build (latest)
          prerelease: true
          body: >
            Latest built dashboard. Unzip into Home Assistant's
            config/www/dashboard/ and open
            /local/dashboard/index.html on your tablet.
          files: dashboard.zip
